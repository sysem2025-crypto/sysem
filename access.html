<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.access.metaTitle">Accesso | SYSEM</title>
  <meta name="description" content="Registrazione e accesso alla documentazione SYSEM.">
  <link rel="stylesheet" href="assets/css/style.css?v=20260813c">
</head>
<body data-page="access" data-required-role="guest">
<div class="site">
  <header class="site-header">
    <div class="site-header__left">
      <a class="brand" href="/" aria-label="SYSEM home">
        <img src="/assets/img/logo.png" alt="Logo SYSEM">
      </a>
      <span class="site-header__menu" id="menu-label"></span>
    </div>
    <div class="nav-container">
      <button class="nav-toggle" id="menu-toggle" aria-label="Apri menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="site-body">
    <div class="content-frame">
      <div class="page-heading">
        <h1 class="page-title" data-i18n="page.access.title">Accesso</h1>
      </div>
      <div class="page-body">
        <div class="auth-grid">
          <article class="auth-card" id="login-section">
            <h2 data-i18n="auth.loginTitle">Login</h2>
            <p data-i18n="auth.loginDesc">Inserisci le credenziali per entrare nell'area riservata.</p>
            <form id="login-form" class="auth-form">
              <label for="login-email" data-i18n="auth.loginLabel">Utente</label>
              <input id="login-email" name="email" type="email" placeholder="nome@azienda.it" autocomplete="username" required data-i18n="auth.emailPlaceholder">
              <label for="login-password" data-i18n="auth.passwordLabel">Password</label>
              <input id="login-password" name="password" type="password" required>
              <button type="submit" class="btn-download" data-i18n="auth.signinBtn">Accedi</button>
            </form>
          </article>

          <article class="auth-card" id="register-section">
            <h2 data-i18n="auth.registerTitle">Registrazione</h2>
            <p data-i18n="auth.registerDesc">Crea un account per accedere all'area riservata.</p>
            <form id="register-form" class="auth-form">
              <label for="register-email" data-i18n="auth.loginLabel">Email</label>
              <input id="register-email" name="email" type="email" placeholder="nome@azienda.it" autocomplete="email" required data-i18n="auth.emailPlaceholder">
              <label for="register-password" data-i18n="auth.passwordLabel">Password</label>
              <input id="register-password" name="password" type="password" required>
              <button type="submit" class="btn-download" data-i18n="auth.registerBtn">Registrati</button>
            </form>
          </article>
        </div>
        <p id="auth-feedback" class="auth-feedback" aria-live="polite"></p>
      </div>
    </div>
  </div>

    <footer class="site-footer" id="site-footer"></footer>
</div>

<div class="overlay-menu" id="overlay-menu">
  <nav>
    <ul></ul>
  </nav>
</div>

<script src="assets/js/auth-supabase.js?v=20260811a"></script>
<script src="assets/js/main.js?v=20260814a"></script>
</body>
</html>
