<script>
    (function() {
      var iframe = document.getElementById('ai-iframe');
      var overlay = document.getElementById('ai-overlay');
      if (!iframe) return;

      function makeToken(user) {
        var today = new Date().toISOString().slice(0, 10);
        var role = user.role || 'base';
        return btoa(user.email + '|' + role + '|' + today);
      }

      function resolveUser() {
        if (typeof window.getCurrentUser === 'function') {
          return window.getCurrentUser().then(function(u) {
            if (u) return u;
            return typeof window.getCachedUser === 'function' ? window.getCachedUser() : null;
          });
        }
        return Promise.resolve(typeof window.getCachedUser === 'function' ? window.getCachedUser() : null);
      }

      resolveUser().then(function(user) {
        if (!user) { overlay.style.display = 'flex'; return; }
        var url = new URL(iframe.dataset.src || iframe.src, window.location.href);
        url.searchParams.set('email', user.email);
        url.searchParams.set('token', makeToken(user));
        iframe.src = url.toString();
        if (overlay) overlay.style.display = 'none';
      });
    })();
  </script>
