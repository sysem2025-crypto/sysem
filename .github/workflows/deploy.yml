name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Code check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check HTML files exist
        run: |
          echo "Checking key files..."
          test -f index.html && echo "  index.html OK"
          test -f resource.html && echo "  resource.html OK"
          test -f ticketing.html && echo "  ticketing.html OK"
          test -f assets/js/main.js && echo "  main.js OK"
          test -f assets/css/style.css && echo "  style.css OK"
          echo "All checks passed."
